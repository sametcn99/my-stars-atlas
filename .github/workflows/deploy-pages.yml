name: Deploy Pages

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Skip the count pre-check and refresh all starred repositories
        required: false
        default: false
        type: boolean
      no_cache:
        description: Ignore the Jev classification cache and reclassify every repository
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Jev classification cache
        if: inputs.no_cache != true
        uses: actions/cache@v4
        with:
          path: .cache
          key: jev-v1-${{ hashFiles('config/categories.json', 'config/config.json', 'src/classify.ts', 'src/taxonomy.ts', 'src/cache.ts') }}-${{ github.run_id }}
          restore-keys: |
            jev-v1-${{ hashFiles('config/categories.json', 'config/config.json', 'src/classify.ts', 'src/taxonomy.ts', 'src/cache.ts') }}-

      - name: Generate catalog data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force == true && 'true' || 'false' }}
          NO_CACHE: ${{ inputs.no_cache == true && 'true' || 'false' }}
        run: bun run update

      - name: Validate source
        run: bun run typecheck

      - name: Build React site
        run: bunx vite build --config vite.config.ts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
